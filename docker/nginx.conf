server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;
  gzip_min_length 1024;

  # Assets con hash en el nombre: caché de 1 año
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Modelos 3D (MIME explícito sin sobrescribir los tipos globales)
  location ~* \.glb$ {
    types { }
    default_type model/gltf-binary;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Texturas, HDRI y buffers
  location ~* \.(gltf|ktx2|hdr|bin|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta devuelve index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
